[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nutrilabel-ocr"
version = "0.1.0"
description = "Read nutrition facts tables from product photos with any OCR engine - with a reproducible benchmark."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karem Marcomini" }]
keywords = ["ocr", "nutrition", "food", "information-extraction", "paddleocr", "tesseract", "open-food-facts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23",
    "pillow>=9.0",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
rapidocr = ["rapidocr_onnxruntime>=1.3"]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
surya = ["surya-ocr>=0.14"]
vlm = ["transformers>=4.57", "torch>=2.3", "accelerate>=0.30", "torchvision"]
paddle-vl = ["paddleocr[doc-parser]>=3.3", "paddlepaddle>=3.0"]
easyocr = ["easyocr>=1.7"]
doctr = ["python-doctr[torch]>=0.8"]
benchmark = ["datasets>=2.18", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "pytesseract>=0.3.10", "matplotlib>=3.7"]
all = ["nutrilabel-ocr[tesseract,rapidocr,paddle,easyocr,doctr,surya,benchmark]"]  # paddle-vl: install separately (GPU)

[project.scripts]
nutrilabel = "nutrilabel.cli:main"
nutrilabel-ui = "nutrilabel.cli:main_ui"

[project.urls]
Homepage = "https://github.com/karemdm/nutrilabel-ocr"
Issues = "https://github.com/karemdm/nutrilabel-ocr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrilabel"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules --ignore=benchmark"
markers = ["slow: needs an OCR engine binary (Tesseract)"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "benchmark", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "N"]
ignore = ["E501", "UP007"]

[tool.coverage.run]
source = ["nutrilabel"]
