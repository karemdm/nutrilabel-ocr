<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nutrilabel-ocr</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d232b; --muted: #687384; --line: #e2e6ec;
    --accent: #0f7b6c; --accent-ink: #ffffff; --warn: #b45309; --err: #b42318; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --panel: #1a2029; --ink: #e7ebf0; --muted: #98a3b3; --line: #2a323e;
            --accent: #2bb39f; --accent-ink: #0d1117; --chip: #232b36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0 14px 0 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  button, select, label.btn { font: inherit; border-radius: 8px; border: 1px solid var(--line);
         background: var(--panel); color: var(--ink); padding: 7px 12px; cursor: pointer; }
  button.primary, label.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px 18px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #files { padding: 8px; max-height: calc(100vh - 110px); overflow: auto; position: sticky; top: 70px; }
  #files .item { display: flex; justify-content: space-between; gap: 8px; align-items: center;
                 padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  #files .item:hover { background: var(--chip); }
  #files .item.active { background: var(--chip); outline: 2px solid var(--accent); }
  #files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .chip.ok { color: var(--accent); } .chip.err { color: var(--err); } .chip.warn { color: var(--warn); }
  #progress { height: 4px; background: var(--line); border-radius: 4px; margin: 6px 4px 10px; overflow: hidden; }
  #progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #detail { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 16px; }
  @media (max-width: 1100px) { #detail { grid-template-columns: 1fr; } }
  #preview { padding: 10px; min-height: 320px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button { padding: 4px 10px; font-size: 13px; }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .views { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; align-items: start; }
  .views.single { grid-template-columns: 1fr; }
  .views figure { margin: 0; }
  .views figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .views img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); }
  #nutrients { padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 4px; } .muted { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.sub { padding-left: 22px; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  #summary { margin: 0 18px 24px; padding: 14px 16px; overflow-x: auto; }
  #drop { border: 2px dashed var(--line); border-radius: 14px; padding: 60px 20px; text-align: center; color: var(--muted); }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #drop strong { color: var(--ink); font-size: 16px; display: block; margin-bottom: 6px; }
  .warnings { margin-top: 10px; font-size: 12px; color: var(--warn); }
  .hidden { display: none !important; }
  .linkish { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>nutri<span>label</span>-ocr</h1>
  <label for="engine" class="muted">Engine</label>
  <select id="engine" aria-label="OCR engine"></select>
  <label class="btn primary" for="pick-files">Open image(s)</label>
  <input id="pick-files" type="file" accept="image/*" multiple>
  <label class="btn" for="pick-dir">Open folder</label>
  <input id="pick-dir" type="file" webkitdirectory directory multiple>
  <button id="run-btn" class="hidden" title="Process the loaded images with the selected engine"></button>
  <span class="spacer"></span>
  <button id="export-csv" disabled>Export CSV</button>
  <button id="export-json" disabled>Export JSON</button>
</header>

<main>
  <aside class="card" id="files">
    <div class="muted" id="files-title" style="padding:4px 6px">No images yet</div>
    <div id="progress"><div></div></div>
    <div id="file-list"></div>
  </aside>

  <section>
    <div id="drop" class="card">
      <strong>Drop product photos here</strong>
      or use <em>Open image(s)</em> / <em>Open folder</em>. Images are processed locally.
    </div>
    <div id="detail" class="hidden">
      <div class="card" id="preview">
        <div class="tabs" role="tablist">
          <button data-view="both" class="on">Side by side</button>
          <button data-view="original">Original</button>
          <button data-view="annotated">Extraction</button>
        </div>
        <div class="views" id="views">
          <figure id="fig-original"><figcaption>Original photo</figcaption><img id="original-img" alt="original photo"></figure>
          <figure id="fig-annotated"><figcaption>What was read</figcaption><img id="preview-img" alt="annotated photo"></figure>
        </div>
      </div>
      <div class="card" id="nutrients">
        <h2 id="d-name"></h2>
        <div class="muted" id="d-meta"></div>
        <div class="muted" id="d-other" style="margin-top:6px;font-size:12px"></div>
        <table style="margin-top:10px">
          <thead><tr><th>Nutrient</th><th class="num">per 100 g</th><th class="num">per serving</th></tr></thead>
          <tbody id="d-rows"></tbody>
        </table>
        <div class="warnings" id="d-warn"></div>
      </div>
    </div>
  </section>
</main>

<section class="card hidden" id="summary">
  <h2>All images <span class="muted" id="s-count"></span></h2>
  <table>
    <thead><tr id="s-head"></tr></thead>
    <tbody id="s-rows"></tbody>
  </table>
</section>

<!--PRELOADED-->
<script>
const NUTRIENTS = [
  ["energy_kj", "Energy (kJ)", "#648fff"], ["energy_kcal", "Energy (kcal)", "#fe6100"],
  ["fat", "Fat", "#0072b2"], ["saturated_fat", "of which saturates", "#e69f00", true],
  ["carbohydrates", "Carbohydrates", "#f0e442"], ["sugars", "of which sugars", "#56b4e9", true],
  ["fiber", "Fibre", "#009e73"], ["proteins", "Protein", "#d55e00"],
  ["salt", "Salt", "#785ef0"], ["sodium", "Sodium", "#cc79a7"],
];
const state = { items: [], active: -1, busy: false, queue: [], vlm: new Set(), gpu: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cur = () => $("engine").value;
const res = (it, e = cur()) => it.results[e];
const stat = (it, e = cur()) => it.statuses[e] || (it.results[e] ? "done" : "none");

function fmt(nv) { return nv ? `${nv.qualifier || ""}${+nv.value.toFixed(3)} ${nv.unit || ""}`.trim() : "–"; }

function chip(it) {
  const st = stat(it);
  if (st === "none") return '<span class="chip">not run</span>';
  if (st === "pending") return '<span class="chip">queued</span>';
  if (st === "running") return `<span class="chip">reading… ${Math.round((Date.now() - it.started) / 1000)}s</span>`;
  const r = res(it);
  if (r.error) return '<span class="chip err">error</span>';
  const n = Object.keys(r.nutrients || {}).length;
  return `<span class="chip ${n ? "ok" : "warn"}">${n} fields</span>`;
}

function renderList() {
  const done = state.items.filter(i => stat(i) === "done").length;
  $("files-title").textContent = state.items.length
    ? `${done} / ${state.items.length} images read with ${cur()}` : "No images yet";
  $("progress").firstElementChild.style.width = state.items.length ? `${100 * done / state.items.length}%` : "0";
  $("file-list").innerHTML = state.items.map((it, i) =>
    `<div class="item ${i === state.active ? "active" : ""}" data-i="${i}">
       <span class="name" title="${esc(it.name)}">${esc(it.name)}</span>${chip(it)}</div>`).join("");
  document.querySelectorAll("#file-list .item").forEach(el => el.onclick = () => select(+el.dataset.i));
  const any = state.items.some(i => stat(i) === "done");
  $("export-csv").disabled = $("export-json").disabled = !any;
  // "Run" button: images not yet read (or failed) with the selected engine
  const todo = state.items.filter(i => i.file && (stat(i) === "none" || (stat(i) === "done" && res(i).error)));
  const btn = $("run-btn");
  btn.className = todo.length && !state.preloaded ? "primary" : "hidden";
  btn.textContent = `Run ${cur()} on ${todo.length} image${todo.length > 1 ? "s" : ""}`;
  btn.onclick = () => enqueue(todo, cur());
}

function select(i) {
  state.active = i; renderList();
  const it = state.items[i];
  if (!it) return;
  $("drop").classList.add("hidden"); $("detail").classList.remove("hidden");
  $("d-name").textContent = it.name;
  const others = Object.entries(it.results).filter(([e]) => e !== cur());
  $("d-other").innerHTML = others.length ? "Also read with: " + others.map(([e, r]) =>
    `<span class="linkish" data-e="${esc(e)}">${esc(e)}</span> (${r.error ? "error" : Object.keys(r.nutrients || {}).length + " fields"})`).join(", ") : "";
  document.querySelectorAll("#d-other .linkish").forEach(el => el.onclick = () => { $("engine").value = el.dataset.e; engineChanged(); });
  const r = res(it);
  if (!r) {
    $("preview-img").removeAttribute("src");
    if (it.original) $("original-img").src = it.original;
    $("d-meta").textContent = stat(it) === "none" ? `Not read with ${cur()} yet - use the "Run" button.` : "Reading…";
    $("d-rows").innerHTML = ""; $("d-warn").textContent = "";
    return;
  }
  if (r.original) it.original = r.original;
  if (r.error) {
    $("preview-img").removeAttribute("src");
    if (it.original) $("original-img").src = it.original; else $("original-img").removeAttribute("src");
    $("d-meta").textContent = r.error; $("d-rows").innerHTML = ""; $("d-warn").textContent = "";
    return;
  }
  $("preview-img").src = r.annotated;
  $("original-img").src = r.original || r.annotated;
  $("d-meta").textContent = `${r.engine} · OCR ${r.ocr_elapsed_s}s · total ${r.total_s}s · ${r.width}×${r.height}px`;
  const rows = NUTRIENTS.map(([k, label, color, sub]) => {
    const a = r.nutrients[`${k}_100g`], b = r.nutrients[`${k}_serving`];
    if (!a && !b) return "";
    return `<tr><td class="${sub ? "sub" : ""}"><span class="dot" style="background:${color}"></span>${label}</td>
            <td class="num">${fmt(a)}</td><td class="num">${fmt(b)}</td></tr>`;
  }).join("");
  $("d-rows").innerHTML = rows || '<tr><td colspan="3" class="muted">No nutrition values found</td></tr>';
  $("d-warn").textContent = (r.warnings || []).join(" · ");
}

const SUMMARY_KEYS = ["energy_kcal", "fat", "saturated_fat", "carbohydrates", "sugars", "proteins", "salt"];
function summaryCell(n, k) {
  if (n[`${k}_100g`]) return fmt(n[`${k}_100g`]);
  if (n[`${k}_serving`]) return `${fmt(n[`${k}_serving`])} <span class="muted">/serv.</span>`;
  return "–";
}
function renderSummary() {
  const done = state.items.filter(i => res(i) && !res(i).error);
  $("summary").classList.toggle("hidden", done.length < 2);
  $("s-count").textContent = `(${done.length}, ${cur()}, per 100 g; "/serv." = only per-serving values on the label)`;
  $("s-head").innerHTML = "<th>Image</th>" + SUMMARY_KEYS.map(k =>
    `<th class="num">${NUTRIENTS.find(n => n[0] === k)[1].replace("of which ", "")}</th>`).join("");
  $("s-rows").innerHTML = done.map(it => "<tr><td>" + esc(it.name) + "</td>" + SUMMARY_KEYS.map(k =>
    `<td class="num">${summaryCell(res(it).nutrients, k)}</td>`).join("") + "</tr>").join("");
}

function engineChanged() {
  const e = cur();
  if (state.vlm.has(e) && !state.gpu)
    alert(`${e} is a vision-language model. Without a GPU it can take several minutes per image, and the first run downloads several GB (see the terminal for progress).`);
  renderList(); renderSummary();
  if (state.active >= 0) select(state.active);
}

function enqueue(items, engine) {
  for (const it of items) { it.statuses[engine] = "pending"; delete it.results[engine]; state.queue.push([it, engine]); }
  renderList();
  if (!state.busy) run();
}

async function addFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|webp|bmp|tiff?)$/i.test(f.name));
  const items = files.map(f => ({ name: f.webkitRelativePath || f.name, file: f, results: {}, statuses: {} }));
  state.items.push(...items);
  enqueue(items, cur());
}

async function run() {
  state.busy = true;
  while (state.queue.length) {
    const [it, engine] = state.queue.shift();
    it.statuses[engine] = "running"; it.started = Date.now(); renderList();
    const ticker = setInterval(renderList, 1000);
    try {
      const r = await fetch(`/api/read?engine=${encodeURIComponent(engine)}&name=${encodeURIComponent(it.name)}`,
                            { method: "POST", body: it.file });
      it.results[engine] = await r.json();
    } catch (e) { it.results[engine] = { error: String(e) }; }
    clearInterval(ticker);
    delete it.statuses[engine];
    const i = state.items.indexOf(it);
    if (state.active < 0 || (state.active === i)) select(i); else renderList();
    renderSummary();
  }
  state.busy = false;
  renderList();
}

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
}
$("export-json").onclick = () => download("nutrilabel_results.json", JSON.stringify(
  state.items.filter(i => res(i)).map(i => ({ image: i.name, ...res(i), annotated: undefined, original: undefined })), null, 2),
  "application/json");
$("export-csv").onclick = () => {
  const keys = NUTRIENTS.flatMap(([k]) => [`${k}_100g`, `${k}_serving`]);
  const lines = [["image", "engine", ...keys].join(",")];
  for (const it of state.items.filter(i => res(i) && !res(i).error))
    lines.push([`"${it.name.replace(/"/g, '""')}"`, res(it).engine,
      ...keys.map(k => res(it).nutrients[k] ? res(it).nutrients[k].value : "")].join(","));
  download("nutrilabel_results.csv", lines.join("\n"), "text/csv");
};

function setView(view) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  $("views").classList.toggle("single", view !== "both");
  $("fig-original").classList.toggle("hidden", view === "annotated");
  $("fig-annotated").classList.toggle("hidden", view === "original");
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));

$("pick-files").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("pick-dir").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", e => addFiles(e.dataTransfer.files));

async function init() {
  if (window.__PRELOADED__) {   // static snapshot (documentation screenshots)
    const p = window.__PRELOADED__;
    $("engine").innerHTML = `<option>${esc(p.engine)}</option>`;
    state.preloaded = true;
    state.items = p.items.map(r => ({ name: r.name, results: { [p.engine]: r }, statuses: {} }));
    select(p.active || 0); renderSummary();
    return;
  }
  try {
    const info = await (await fetch("/api/engines")).json();
    const opt = e => `<option value="${esc(e)}" ${e === info.default ? "selected" : ""}>${esc(e)}</option>`;
    const classic = info.classic || info.engines, vlm = info.vlm || [];
    $("engine").innerHTML =
      `<optgroup label="OCR engines (CPU)">${classic.map(opt).join("")}</optgroup>` +
      (vlm.length ? `<optgroup label="Vision-language models (${info.gpu ? "GPU found" : "no GPU: very slow"}, first use downloads several GB)">${vlm.map(opt).join("")}</optgroup>` : "");
    state.vlm = new Set(vlm); state.gpu = info.gpu;
    $("engine").onchange = engineChanged;
    if (!info.engines.length) $("drop").innerHTML = "<strong>No OCR engine installed</strong>Run <code>nutrilabel engines</code> to see install options.";
  } catch (e) { $("drop").innerHTML = "<strong>Server not reachable</strong>Start it with <code>nutrilabel ui</code>."; }
  renderList();
}
init();
</script>
</body>
</html>
