name: Benchmark

on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma-separated OCR engines to benchmark"
        required: false
        default: "gcv,tesseract,rapidocr"
        type: string
      limit:
        description: "Maximum number of labels to process"
        required: false
        default: "50"
        type: string

jobs:
  benchmark:
    name: Benchmark OCR engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-spa

      - name: Install package with engine and benchmark extras
        run: pip install -e ".[tesseract,rapidocr,benchmark]"

      - name: Run benchmark
        env:
          ENGINES: ${{ inputs.engines }}
          LIMIT: ${{ inputs.limit }}
        run: python -m benchmark.run --engines "$ENGINES" --limit "$LIMIT"

      - name: Build report
        run: python -m benchmark.report

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark/results/summary.json
            docs/benchmark_results.md
            docs/assets/*.png
